<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>STANSPACE 3D Viewer</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="viewer" aria-label="Interactive 3D viewer"></main>

    <header class="brand">
      <span class="mark">S</span>
      <div>
        <strong>STANSPACE</strong>
        <small>Web 3D Viewer</small>
      </div>
    </header>

    <section id="welcome" class="panel">
      <p class="eyebrow">READY FOR YOUR MODEL</p>
      <h1>Explore the space</h1>
      <p>Open a SketchUp-exported GLB file to preview it on this device.</p>
      <label class="button" for="model-input">Open GLB file</label>
      <input id="model-input" type="file" accept=".glb,model/gltf-binary" />
      <p class="hint">On desktop, you can also drop a .glb file anywhere.</p>
    </section>

    <div id="loading" class="status" hidden>Loading model…</div>
    <div id="error" class="status error" hidden></div>
    <div class="controls">Drag to orbit · Pinch or scroll to zoom</div>

    <script type="module" src="./viewer.js"></script>
  </body>
</html>
