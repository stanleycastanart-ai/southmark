<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>STANSPACE 3D Viewer</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="viewer" aria-label="Interactive 3D viewer"></main>

    <header class="brand">
      <span class="mark">S</span>
      <div>
        <strong>STANSPACE</strong>
        <small>Southmark · 3D Presentation</small>
      </div>
    </header>

    <section class="project-label" aria-label="Project information">
      <span class="live-dot"></span>
      <span>INTERIOR STUDY</span>
      <b>SOUTHMARK</b>
    </section>

    <section id="welcome" class="panel">
      <p class="eyebrow">READY FOR YOUR MODEL</p>
      <h1>Explore the space</h1>
      <p>Open a SketchUp-exported GLB file to preview it on this device.</p>
      <label class="button" for="model-input">Open GLB file</label>
      <input id="model-input" type="file" accept=".glb,model/gltf-binary" />
      <p class="hint">On desktop, you can also drop a .glb file anywhere.</p>
    </section>

    <div id="loading" class="status" hidden>Loading space…</div>
    <div id="error" class="status error" hidden></div>
    <nav class="presentation-controls" aria-label="Presentation controls">
      <div class="view-picker" role="group" aria-label="Camera views">
        <button type="button" class="view-button active" data-view="overview">Overview</button>
        <button type="button" class="view-button" data-view="front">Front</button>
        <button type="button" class="view-button" data-view="side">Side</button>
      </div>
      <div class="utility-controls">
        <button type="button" class="icon-button" id="reset-view" aria-label="Reset camera" title="Reset camera">
          <span aria-hidden="true">↺</span>
        </button>
        <button type="button" class="icon-button" id="fullscreen" aria-label="Enter fullscreen" title="Fullscreen">
          <span aria-hidden="true">⛶</span>
        </button>
      </div>
    </nav>
    <div class="gesture-hint"><span class="gesture-icon">⌁</span> Drag to orbit <i></i> Pinch to zoom</div>

    <script type="module" src="./viewer.js?v=3"></script>
  </body>
</html>
